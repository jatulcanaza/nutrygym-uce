version: "3.9"

services:
  gateway:
    image: juantulcanaza/nutrygym-gateway:qa-2
    container_name: nutrigym-gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - user-profile-service
      - authorization-service
      - nutrition-form
      - plan-management
      - ai-generator-service
    restart: unless-stopped
    networks:
      - nutrigym-network

  # AUTH SERVICE + POSTGRES
  auth-service:
    image: juantulcanaza/auth-service:qa-1
    container_name: auth-service
    env_file: ./.env.auth
    depends_on:
      - auth-db
    restart: unless-stopped
    networks:
      - nutrigym-network

  auth-db:
    image: postgres:15
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nutrigym-network

  # USER PROFILE + POSTGRES
  user-profile-service:
    image: juantulcanaza/user-profile-service:qa-1
    container_name: user-profile-service
    env_file: ./.env.user-profile
    depends_on:
      user-profile-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nutrigym-network

  user-profile-db:
    image: postgres:15
    container_name: user-profile-db
    environment:
      POSTGRES_DB: user_profile_db
      POSTGRES_USER: user_profile_user
      POSTGRES_PASSWORD: user_profile_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_profile_user -d user_profile_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - user_profile_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nutrigym-network

  # AUTHORIZATION (RBAC)
  authorization-service:
    image: juantulcanaza/authorization-service:qa-1
    container_name: authorization-service
    env_file: ./.env.authz
    restart: unless-stopped
    networks:
      - nutrigym-network

  # NUTRITION FORM + POSTGRES + REDIS + KAFKA
  nutrition-form:
    image: juantulcanaza/nutrition-form-service:qa-1
    container_name: nutrition-form
    env_file: ./.env.nutrition
    depends_on:
      nutrition-postgres:
        condition: service_healthy
      nutrition-redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - nutrigym-network

  nutrition-postgres:
    image: postgres:15-alpine
    container_name: nutrition-postgres
    environment:
      POSTGRES_DB: nutrigym_nutrition
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nutrigym_nutrition"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - nutrition_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nutrigym-network

  nutrition-redis:
    image: redis:7-alpine
    container_name: nutrition-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nutrigym-network

  # KAFKA
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: nutrigym-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
    restart: unless-stopped
    networks:
      - nutrigym-network

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: nutrigym-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    networks:
      - nutrigym-network

  # PLAN MANAGEMENT + POSTGRES + REDIS
  plan-management:
    image: juantulcanaza/plan-management-service:qa-1
    container_name: plan-management
    env_file: ./.env.plans
    depends_on:
      plan-postgres:
        condition: service_healthy
      plan-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - nutrigym-network

  plan-postgres:
    image: postgres:15-alpine
    container_name: plan-postgres
    environment:
      POSTGRES_DB: nutrigym_plans
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nutrigym_plans"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - plan_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nutrigym-network

  plan-redis:
    image: redis:7-alpine
    container_name: plan-redis
    restart: unless-stopped
    networks:
      - nutrigym-network

  # AI GENERATOR + MONGO
  ai-generator-mongo:
    image: mongo:7.0
    container_name: ai-generator-mongo
    volumes:
      - ai_mongo_data:/data/db
    restart: unless-stopped
    networks:
      - nutrigym-network

  ai-generator-service:
    image: juantulcanaza/ai-generator-service:qa-1
    container_name: ai-generator-service
    env_file: ./.env.ai
    depends_on:
      - ai-generator-mongo
      - kafka
    restart: unless-stopped
    networks:
      - nutrigym-network

networks:
  nutrigym-network:
    driver: bridge

volumes:
  auth_postgres_data:
  user_profile_postgres_data:
  nutrition_postgres_data:
  plan_postgres_data:
  ai_mongo_data:
