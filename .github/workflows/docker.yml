name: CI - Build & Push Docker Images (QA)

on:
  push:
    branches: ["qa"]

env:
  DOCKERHUB_NAMESPACE: juantulcanaza
  QA_TAG: qa-${{ github.run_number }}

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - "apps/web/**"
            gateway:
              - "infrastructure/terraform/modules/gateway/**"
            auth:
              - "services/auth-service/**"
            authorization:
              - "services/role_permission-service/**"
            user_profile:
              - "services/user-profile-service/**"
            nutrition_form:
              - "services/nutrition-form-service/**"
            plan_management:
              - "services/plan-management-service/**"
            ai_generator:
              - "services/ai-generator-service/**"

      - name: Build matrix from changes
        id: set-matrix
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          echo "Detected changes: $CHANGES"

          # Construye un array JSON solo con lo que cambió
          MATRIX="[]"

          add() {
            MATRIX=$(node -e "
              const m = JSON.parse(process.env.MATRIX);
              m.push(JSON.parse(process.env.ITEM));
              console.log(JSON.stringify(m));
            " )
          }

          export MATRIX

          if echo "$CHANGES" | grep -q '"web"'; then
            export ITEM='{"image":"nutrygym-web","context":"./apps/web","dockerfile":"./apps/web/Dockerfile"}'
            add
          fi

          if echo "$CHANGES" | grep -q '"gateway"'; then
            export ITEM='{"image":"nutrygym-gateway","context":"./","dockerfile":"./infrastructure/terraform/modules/gateway/Dockerfile"}'
            add
          fi

          if echo "$CHANGES" | grep -q '"auth"'; then
            export ITEM='{"image":"auth-service","context":"./services/auth-service","dockerfile":"./services/auth-service/Dockerfile"}'
            add
          fi

          if echo "$CHANGES" | grep -q '"authorization"'; then
            export ITEM='{"image":"authorization-service","context":"./services/role_permission-service","dockerfile":"./services/role_permission-service/Dockerfile"}'
            add
          fi

          if echo "$CHANGES" | grep -q '"user_profile"'; then
            export ITEM='{"image":"user-profile-service","context":"./services/user-profile-service","dockerfile":"./services/user-profile-service/Dockerfile"}'
            add
          fi

          if echo "$CHANGES" | grep -q '"nutrition_form"'; then
            export ITEM='{"image":"nutrition-form-service","context":"./services/nutrition-form-service","dockerfile":"./services/nutrition-form-service/Dockerfile"}'
            add
          fi

          if echo "$CHANGES" | grep -q '"plan_management"'; then
            export ITEM='{"image":"plan-management-service","context":"./services/plan-management-service","dockerfile":"./services/plan-management-service/Dockerfile"}'
            add
          fi

          if echo "$CHANGES" | grep -q '"ai_generator"'; then
            export ITEM='{"image":"ai-generator-service","context":"./services/ai-generator-service","dockerfile":"./services/ai-generator-service/Dockerfile"}'
            add
          fi

          echo "Final matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push changed images
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ env.QA_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:qa-latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:qa-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
