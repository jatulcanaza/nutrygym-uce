version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9093:9092"  # Externo: 9093, Interno: 9092
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  mongo:
    image: mongo:7.0
    ports:
      - "27018:27017"

  ai-generator-service:
    build: .
    ports:
      - "3006:3006"
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      # Sobreescribe para usar el puerto correcto
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: >
      sh -c "echo 'Esperando 20 segundos para que Kafka esté completamente listo...' &&
             sleep 20 &&
             echo 'Iniciando servicio AI Generator...' &&
             uvicorn main:app --host 0.0.0.0 --port 3006"