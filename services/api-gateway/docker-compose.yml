services:
  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      # Variables que el código espera
      - AUTH_SERVICE=http://auth_service:3001  # ¡GUION BAJO!
      - USER_PROFILE_SERVICE=http://user-profile-service-user-profile-service-1:3002
      - AUTHORIZATION_SERVICE=http://authorization-service:3003  
      - NUTRITION_FORM_SERVICE=http://nutrition-form-service-nutrition-form-1:3004
    volumes:
      - .:/app
      - /app/node_modules  # Evita sobrescribir node_modules
    networks:
      - nutrigym-network

networks:
  nutrigym-network:
    external: true