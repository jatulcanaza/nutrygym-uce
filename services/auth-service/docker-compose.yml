version: "3.9"

services:
  auth-service:
    build: .
    container_name: auth_service
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - auth-db
    networks:
      - nutrigym-network

  auth-db:
    image: postgres:15
    container_name: auth_postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nutrigym-network

volumes:
  postgres_data:

networks:
  nutrigym-network:
    external: true
